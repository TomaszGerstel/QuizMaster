services:
  quizmaster-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dokploy
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - quizmaster-mongodb
    networks:
      - dokploy-network
    labels:
      prometheus: "true"
      metrics_port: "8080"
      metrics_path: "/actuator/prometheus"
    mem_limit: 512m
    cpus: 1

  quizmaster-frontend:
    build:
      context: ./src/main/resources/frontend/quizmaster
      dockerfile: Dockerfile
    depends_on:
      - quizmaster-backend
    networks:
      - dokploy-network

  quizmaster-mongodb:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - dokploy-network

volumes:
  mongo-data:
