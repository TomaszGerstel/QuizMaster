<div class="container">
  <h4>Quizzes list (click to expand):</h4>
  <div class="list-group">
    <a class="list-group-item list-group-item-action fw-bolder mb-2 border-1"
       *ngFor="let quiz of quizzes" (click)="expandedQuizId = quiz.id">
      {{ quiz.title + " (" + quiz.questionsQuantity + " questions)" }}
      <div *ngIf="expandedQuizId === quiz.id" class="p-3">
        <div class="mb-3 d-flex align-items-center">
          <label for="nameInput" class="form-label me-2">Name:</label>
          <input type="text" id="nameInput" class="form-control me-3" [(ngModel)]="username" placeholder="Enter your name">
          <label for="emailInput" class="form-label me-2">Email:</label>
          <input type="email" id="emailInput" class="form-control" [(ngModel)]="email" placeholder="Enter your email">
        </div>
        <button class="btn btn-primary" title="start quiz" (click)="startQuiz(quiz.id)">Start Quiz</button>
      </div>
    </a>
  </div>
</div>
