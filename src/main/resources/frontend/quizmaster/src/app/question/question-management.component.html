<div class="container">
  <h4>Questions management</h4>

  <span class="text-muted">
    Add new question or search existing questions by tag
  </span>

  <div class="d-flex mb-4 mt-3 gap-2">
    <button class="btn btn-primary" (click)="createNewQuestion()">
      Create new question
    </button>
  </div>

  <hr>

  <div class="mb-4">
    <label for="tagSearch" class="form-label">Search by tag</label>

    <div class="input-group">
      <input
        id="tagSearch"
        type="text"
        class="form-control"
        [(ngModel)]="tagSearch"
        placeholder="Enter tag..."
      />

      <button
        class="btn btn-outline-primary"
        (click)="loadQuestions()"
      >
        Search
      </button>
    </div>
  </div>

  <div *ngIf="questions.length > 0">
    <div
      *ngFor="let question of questions"
      class="card mb-3"
    >
      <div class="card-body">
        <h5>{{ question.question }}</h5>

        <p class="text-muted">
          {{ question.tags }}
        </p>

        <button
          class="btn btn-sm btn-warning"
          (click)="editQuestion(question)"
        >
          Edit
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="questions.length === 0 && tagSearch">
    <p class="text-muted">No questions found.</p>
  </div>
</div>
